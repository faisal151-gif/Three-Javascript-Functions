  <main>
    <h1>Fortune Generator</h1>
    <p>A random fortune is shown below every time the page loads. Click a coloured square to change the box.</p>
  </main>

  <!-- Question 1: the fortune box with four buttons beside it, just above the footer -->
  <div class="fortune-row">
    <!-- js/fortune.js puts the random fortune inside this box -->
    <div id="fortune-box">Loading your fortune...</div>

    <!-- The four colour buttons, two per row -->
    <div>
      <div>
        <button id="green-button" class="color-button" title="Green"></button>
        <button id="yellow-button" class="color-button" title="Yellow"></button>
      </div>
      <div>
        <button id="blue-button" class="color-button" title="Blue"></button>
        <button id="orange-button" class="color-button" title="Orange"></button>
      </div>
    </div>
  </div>
